<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Google PAC-MAN - Epify Kids</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0B0E14;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .pacman-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 24px;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      color: #FFD93D;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255, 217, 61, 0.15);
      color: #FFD93D;
      border: 1px solid rgba(255, 217, 61, 0.3);
      text-transform: uppercase;
    }

    /* Game board container with auto-scaling */
    .arcade-frame {
      position: relative;
      background: #000000;
      border: 2px solid #202636;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(255, 217, 61, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      width: 100%;
      height: 200px;
      touch-action: none;
    }

    /* Google PAC-MAN 2010 Doodle elements must use content-box so dimensions are not collapsed */
    #board-scaler,
    #board-scaler *,
    #lga,
    #lga *,
    #logo,
    #logo *,
    #pcm-c,
    #pcm-c *,
    #pcm-p,
    #pcm-p * {
      box-sizing: content-box !important;
    }

    #board-scaler {
      transform-origin: center center;
      transition: transform 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 554px;
      height: 186px;
    }

    #lga {
      width: 554px;
      height: 186px;
      position: relative;
    }

    #logo {
      width: 554px;
      height: 186px;
      background: black url(pacman10-hp.png) 0 0 no-repeat;
      position: relative;
    }

    #logo-l {
      width: 200px;
      height: 2px;
      left: 177px;
      top: 157px;
      background: #990;
      position: absolute;
      display: none;
      overflow: hidden;
    }

    #logo-b {
      position: absolute;
      left: 0;
      background: #ff0;
      height: 8px;
      width: 0;
    }

    /* Controls & Buttons */
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      width: 100%;
      justify-content: center;
    }

    .btn-arcade {
      background: linear-gradient(135deg, #FFD93D 0%, #FFA800 100%);
      color: #1A1300;
      border: none;
      border-radius: 24px;
      padding: 10px 22px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(255, 170, 0, 0.4);
      transition: all 0.15s ease;
    }

    .btn-arcade:active {
      transform: scale(0.96);
      box-shadow: 0 2px 6px rgba(255, 170, 0, 0.3);
    }

    .btn-sound {
      background: #181E29;
      color: #94A3B8;
      border: 1px solid #2B3545;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-sound:active {
      background: #202636;
      color: #FFFFFF;
    }

    /* Virtual D-pad for touch devices */
    .dpad-container {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      max-width: 280px;
    }

    .dpad-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }

    .dpad-btn {
      width: 64px;
      height: 52px;
      background: #181E29;
      color: #F1F5F9;
      border: 1.5px solid #2D3748;
      border-radius: 12px;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      touch-action: manipulation;
      transition: background 0.1s, transform 0.1s;
    }

    .dpad-btn:active {
      background: #FFD93D;
      color: #1A1300;
      border-color: #FFA800;
      transform: scale(0.92);
    }

    .instructions {
      margin-top: 12px;
      font-size: 0.74rem;
      color: #64748B;
      text-align: center;
      line-height: 1.4;
    }
  </style>

  <script>
    window.google = {
      time: function () {
        return (new Date).getTime();
      },
      Toolbelt: {},
      y: {},
      dstr: [],
      rein: []
    };
  </script>
</head>
<body>
  <div class="pacman-wrapper">
    <div class="header-bar">
      <div class="title-group">
        <span style="font-size: 1.3rem;">🟡</span>
        <h1>Google PAC-MAN</h1>
      </div>
      <span class="badge">Arcade Clásico</span>
    </div>

    <!-- Contenedor del Juego -->
    <div class="arcade-frame" id="arcade-frame">
      <div id="board-scaler">
        <div id="lga">
          <div id="logo" title="PAC-MAN's 30th Birthday!">
            <div id="logo-l">
              <div id="logo-b"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="action-row">
      <button class="btn-arcade" id="insert-coin-btn">
        <span>🪙</span> ¡Insertar Moneda!
      </button>
      <button class="btn-sound" id="sound-btn">
        <span id="sound-icon">🔊</span> Sonido
      </button>
    </div>

    <!-- D-Pad Virtual Táctil para Teléfonos y Tablets -->
    <div class="dpad-container" id="dpad">
      <div class="dpad-row">
        <button class="dpad-btn" id="btn-up" aria-label="Arriba">▲</button>
      </div>
      <div class="dpad-row">
        <button class="dpad-btn" id="btn-left" aria-label="Izquierda">◄</button>
        <button class="dpad-btn" id="btn-down" aria-label="Abajo">▼</button>
        <button class="dpad-btn" id="btn-right" aria-label="Derecha">►</button>
      </div>
    </div>

    <div class="instructions">
      <p style="margin: 0;">Usa el D-Pad táctil, desliza tu dedo en la pantalla o usa las <strong>flechas del teclado</strong> para mover a Pac-Man.</p>
    </div>
  </div>

  <script src="google-script.js"></script>
  <script>
    google.neegg = 1;

    // Escalar dinámicamente el juego para que se ajuste a cualquier pantalla
    function updateGameScale() {
      var frame = document.getElementById('arcade-frame');
      var scaler = document.getElementById('board-scaler');
      if (!frame || !scaler) return;

      var frameWidth = frame.clientWidth || frame.offsetWidth || 554;
      var boardWidth = 554;
      var boardHeight = 186;

      var scale = Math.min(1, (frameWidth - 8) / boardWidth);
      scaler.style.transform = 'scale(' + scale + ')';
      scaler.style.webkitTransform = 'scale(' + scale + ')';
      frame.style.height = Math.round(boardHeight * scale + 14) + 'px';
    }

    updateGameScale();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', updateGameScale);
    }
    window.addEventListener('resize', updateGameScale);
    window.addEventListener('load', updateGameScale);

    // Sonido toggle
    var soundEnabled = true;
    var soundBtn = document.getElementById('sound-btn');
    var soundIcon = document.getElementById('sound-icon');
    if (soundBtn) {
      soundBtn.addEventListener('click', function () {
        soundEnabled = !soundEnabled;
        soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
        if (typeof google !== 'undefined' && google.pacman && google.pacman.game) {
          google.pacman.game.soundAvailable = soundEnabled;
          if (!soundEnabled && typeof PacManAudioEngine !== 'undefined') {
            PacManAudioEngine.stopAmbientTrack();
          }
        }
      });
    }

    // Inicialización del juego PAC-MAN
    google.pml = function () {
      function d(a) {
        if (!google.pml_installed) {
          google.pml_installed = true;
          if (!a) {
            document.getElementById("logo").style.background = "black";
            window.setTimeout(function () {
              var b = document.getElementById("logo-l");
              if (b) b.style.display = "block";
            }, 400);
          }
          var audio = document.createElement("script");
          audio.type = "text/javascript";
          audio.src = "pacman-audio.js";
          audio.onload = function () {
            var s = document.createElement("script");
            s.type = "text/javascript";
            s.src = "pacman.js";
            google.dom.append(s);
          };
          google.dom.append(audio);
        }
      }

      function e() {
        var btn = document.getElementById("insert-coin-btn");
        if (btn) {
          btn.onclick = function () {
            if (typeof google.pacman !== "undefined" && google.pacman.insertCoin) {
              google.pacman.insertCoin();
            } else {
              google.pacManSound = true;
              d(false);
              setTimeout(function () {
                if (typeof google.pacman !== "undefined" && google.pacman.insertCoin) {
                  google.pacman.insertCoin();
                }
              }, 1200);
            }
            btn.innerHTML = '<span>⚡</span> ¡Jugando!';
            setTimeout(function() {
              btn.innerHTML = '<span>🪙</span> Moneda extra';
            }, 2500);
            return false;
          };
        }
      }

      if (!google.pml_loaded) {
        google.pml_loaded = true;
        window.setTimeout(function () {
          d(true);
        }, 150);
        e();
        google.rein && google.rein.push(e);
        google.dstr && google.dstr.push(function () {
          google.pacman && google.pacman.destroy();
          if (google.pml_installed) {
            google.pml_installed = false;
          }
        });
        google.pacManQuery = function () {
          return false;
        };
      }
    };

    google.pml && google.pml();

    // Controles direccionales (D-Pad y Swipe)
    function sendDirection(keyCode) {
      if (typeof google !== 'undefined' && google.pacman && google.pacman.keyPressed) {
        google.pacman.keyPressed(keyCode);
      }
      var ev = new KeyboardEvent('keydown', { keyCode: keyCode, which: keyCode, bubbles: true });
      Object.defineProperty(ev, 'keyCode', { value: keyCode });
      Object.defineProperty(ev, 'which', { value: keyCode });
      document.dispatchEvent(ev);
    }

    function bindTouchButton(id, keyCode) {
      var el = document.getElementById(id);
      if (!el) return;
      var trigger = function (e) {
        e.preventDefault();
        sendDirection(keyCode);
      };
      el.addEventListener('touchstart', trigger, { passive: false });
      el.addEventListener('mousedown', trigger);
    }

    bindTouchButton('btn-up', 38);
    bindTouchButton('btn-down', 40);
    bindTouchButton('btn-left', 37);
    bindTouchButton('btn-right', 39);

    // Swipe en el tablero del juego
    var touchStartX = 0;
    var touchStartY = 0;
    var arcadeFrame = document.getElementById('arcade-frame');

    if (arcadeFrame) {
      arcadeFrame.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches[0]) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      arcadeFrame.addEventListener('touchend', function (e) {
        if (e.changedTouches && e.changedTouches[0]) {
          var dx = e.changedTouches[0].clientX - touchStartX;
          var dy = e.changedTouches[0].clientY - touchStartY;
          var absDx = Math.abs(dx);
          var absDy = Math.abs(dy);

          if (Math.max(absDx, absDy) > 20) {
            if (absDx > absDy) {
              sendDirection(dx > 0 ? 39 : 37); // Right : Left
            } else {
              sendDirection(dy > 0 ? 40 : 38); // Down : Up
            }
          }
        }
      }, { passive: true });
    }

    // Inicializar escalado
    setTimeout(updateGameScale, 100);
    setTimeout(updateGameScale, 500);
  </script>
</body>
</html>
